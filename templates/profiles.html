{% extends "layout.html" %}
{% block title %}
    Profiles
{% endblock %}
{% block content %}
    <h1>Profiles</h1>
    <ul>
        {% for profile in profiles %}
            <li>{{ profile["username"] }}</li>
            <a href="/profile/{{ profile['username'] }}">See profile</a>
        {% endfor %}
    </ul>
{% endblock %}
