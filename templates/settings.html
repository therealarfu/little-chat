{% extends "layout.html" %}
{% block title %}
    Profile Settings
{% endblock %}
{% block content %}
    <h1>Profile Settings</h1>
    <p>This is the profile settings page.</p>
    <h2>Account settings</h2>
    <form action="/settings/change_image" method="POST" enctype="multipart/form-data">
        <label for="image">Profile Image:</label>
        {% if image %}
            <img style="width: 200px; height: 200px;" src="{{ url_for('static', filename='uploads/' + image) }}" alt="Profile Image">
        {% else %}
            <img style="width: 200px; height: 200px;" src="{{ url_for('static', filename='uploads/default.png') }}" alt="Profile Image">
        {% endif %}
        <input type="file" name="image" accept="image/*">
        <input type="submit" value="Upload">
    </form>
    <form action="/settings/change_username" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" value="{{ username }}" required><br><br>
        <input type="submit" value="Change username">
    </form>
    <form action="/settings/remove_account" method="POST">
        <input type="submit" value="Delete account">
    </form>
    <form action="/settings/change_password" method="POST">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <label for="newpass">New password:</label>
        <input type="password" id="newpass" name="newpass" required><br><br>
        <input type="submit" value="Change password">
    </form>
    <h2>Personal Information</h2>
    <form action="/settings/change_info" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ name }}" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ email }}" required><br><br>
        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" value="{{ phone }}" required><br><br>
        <label for="description">Description:</label>
        <textarea id="description" name="description" rows="4" cols="50">{{ description }}</textarea><br><br>
        <input type="submit" value="Update">
    </form>
{% endblock %}
